    .form-group input { width: 100%; padding: 10px; border: 1px solid #ccd0d5; border-radius: 6px; font-size: 15px; }
    
    /* Buttons */
    .btn { display: inline-block; width: 100%; padding: 12px; background: #42b72a; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }

    .btn-submit:hover { background: #166fe5; }
    .btn-print { background: #606770; margin-bottom: 20px; }
    .btn-print:hover { background: #4b4f56; }
    
    /* Sticky Top Header Bar */
    .header-bar { display: flex; justify-content: space-between; align-items: center; background: #e7f3ff; padding: 12px 20px; border-radius: 6px; margin-bottom: 20px; position: sticky; top: 10px; z-index: 100; border: 1px solid #1877f2; }

    /* MCQ Layout */
    .question-card { border: 1px solid #e4e6eb; border-radius: 6px; padding: 16px; margin-bottom: 16px; background: #fff; }
    .question-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
    .options-list { list-style: none; }
    .option-item { padding: 10px 14px; border: 1px solid #ccd0d5; border-radius: 4px; margin-bottom: 8px; cursor: pointer; transition: background 0.15s; display: flex; align-items: center; }
    .option-item:hover { background: #f2f3f5; }
    .option-item input[type="radio"] { margin-right: 12px; transform: scale(1.2); }
    
    /* Review Color Styles */
    .correct-ans { background-color: #d4edda !important; border-color: #28a745 !important; color: #155724; font-weight: bold; }
    .wrong-ans { background-color: #f8d7da !important; border-color: #dc3545 !important; color: #721c24; font-weight: bold; }
    .status-tag { margin-top: 8px; font-size: 14px; font-weight: bold; }

    /* Summary Dashboard */
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; margin-bottom: 25px; text-align: center; }
    .metric-card { background: #f7f8fa; border: 1px solid #e4e6eb; padding: 15px; border-radius: 6px; }
    .metric-card div { font-size: 22px; font-weight: bold; margin-top: 4px; }
    
    .hidden { display: none !important; }

    /* Print styles */
    @media print {
      body { background: #fff; padding: 0; }
      .container { box-shadow: none; border: none; max-width: 100%; padding: 0; }

    { q: "2026 ICC Men's T20 World Cup-এ নিউজিল্যান্ডকে হারিয়ে চ্যাম্পিয়ন হয়ে ভারত কোন নজির গড়ে?", options: ["A) প্রথমবার T20 World Cup-এ অংশগ্রহণ", "B) পরপর দুটি Men's T20 World Cup জয়ী প্রথম দল", "C) প্রথমবার বিদেশের মাটিতে T20 World Cup জয়", "D) প্রথমবার ফাইনালে উঠা"], ans: "B" },
    { q: "2026 ICC Women's T20 World Cup জিতে অস্ট্রেলিয়া কততমবার এই শিরোপা অর্জন করে?", options: ["A) পঞ্চম", "B) ষষ্ঠ", "C) সপ্তম", "D) অষ্টম"], ans: "C" },

    { q: "‘Chandrayaan-3’-এর ল্যান্ডারের নাম কী?", options: ["A) Vikram", "B) Pragyan", "C) Aryabhata", "D) Rohini"], ans: "A" },
    { q: "2026 সালে বেঙ্গালুরুতে অনুষ্ঠিত 5th BRICS SAI Leaders’ Summit-এর কেন্দ্রীয় Theme কী ছিল?", options: ["A) Digital India for Global Growth", "B) Ease of Living with a Focus on Urban Mobility", "C) Green Economy and Climate Justice", "D) Inclusive Growth through AI"], ans: "B" },
    { q: "2026 G20 Innovation Ministers’ Meeting-এ ভারতের প্রতিনিধি দল কোথায় অনুষ্ঠিত বৈঠকে অংশ নেয়?", options: ["A) নিউ ইয়র্ক", "B) Chapel Hill, North Carolina", "C) Washington D.C.", "D) Los Angeles"], ans: "B" }
  ];

  let currentStudent = { name: "", phone: "" };
  let timerInterval = null;

  // Login Authorization
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const name = document.getElementById('studentName').value.trim();
    const phone = document.getElementById('studentPhone').value.trim();

    if (!ALLOWED_MOBILES.includes(phone)) {
      alert("Unauthorized! This phone number is not registered to access the test.");
      return;
    }

    let attempts = parseInt(localStorage.getItem('attempts_' + phone) || "0");
    if (attempts >= MAX_ATTEMPTS) {
      alert("Attempt Limit Exceeded! You have already reached the maximum 30 attempts.");
      return;
    }

    // Increment Attempt Count
    localStorage.setItem('attempts_' + phone, attempts + 1);
    currentStudent = { name, phone };

    // Display Test Screen
    document.getElementById('displayName').innerText = name;
    document.getElementById('loginSection').classList.add('hidden');
    document.getElementById('examSection').classList.remove('hidden');

    renderQuestions();
    startTimer(90 * 60); // 90 Minutes
  });

  // Render 100 Questions
  function renderQuestions() {
    const container = document.getElementById('questionsContainer');
    container.innerHTML = questionsData.map((item, idx) => `
      <div class="question-card" id="q_card_${idx}">
        <div class="question-title">${idx + 1}. ${item.q}</div>
        <div class="options-list">
          ${item.options.map((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            return `
              <label class="option-item">
                <input type="radio" name="q_${idx}" value="${letter}">
                ${opt}
              </label>
            `;
          }).join('')}
        </div>
      </div>
    `).join('');
  }

  // Timer Countdown Function
  function startTimer(secondsLeft) {
    const timerDisplay = document.getElementById('timerDisplay');
    
    timerInterval = setInterval(() => {
      let minutes = Math.floor(secondsLeft / 60);
      let seconds = secondsLeft % 60;

      minutes = minutes < 10 ? "0" + minutes : minutes;
      seconds = seconds < 10 ? "0" + seconds : seconds;

      timerDisplay.textContent = `${minutes}:${seconds}`;

      if (--secondsLeft < 0) {
        clearInterval(timerInterval);
        alert("Time expired! Submitting your answers automatically.");
        submitExam();
      }
    }, 1000);
  }

  // Calculate Marks & Submit Exam
  function submitExam() {
    clearInterval(timerInterval);

    let correctCount = 0;
    let wrongCount = 0;
    let unattemptedCount = 0;
    let totalScore = 0;

    questionsData.forEach((item, idx) => {
      const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
      if (selected) {
        if (selected.value === item.ans) {
          correctCount++;
          totalScore += 2;
        } else {
          wrongCount++;
          totalScore -= 0.5;
        }
      } else {
        unattemptedCount++;
      }
    });

    // Update Result Metrics
    document.getElementById('scoreVal').innerText = totalScore;
    document.getElementById('correctVal').innerText = correctCount;
    document.getElementById('wrongVal').innerText = wrongCount;
    document.getElementById('unattemptedVal').innerText = unattemptedCount;

    // Send Result Data to Google Sheets
    syncResultsToGoogleSheet({
      name: currentStudent.name,
      phone: currentStudent.phone,
      score: totalScore,
      correct: correctCount,
      wrong: wrongCount,
      unattempted: unattemptedCount
    });

    // Render Preview
    renderReview();

    document.getElementById('examSection').classList.add('hidden');
    document.getElementById('resultSection').classList.remove('hidden');
  }

  // Render Green / Red Review Screen
  function renderReview() {
    const container = document.getElementById('reviewContainer');
    container.innerHTML = questionsData.map((item, idx) => {
      const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
      const userSelection = selected ? selected.value : null;

      return `
        <div class="question-card">
          <div class="question-title">${idx + 1}. ${item.q}</div>
          <div class="options-list">
            ${item.options.map((opt, oIdx) => {
              const letter = String.fromCharCode(65 + oIdx);
              let styleClass = "";
              
              if (letter === item.ans) {
                styleClass = "correct-ans";
              } else if (userSelection === letter && userSelection !== item.ans) {
                styleClass = "wrong-ans";
              }

              return `<div class="option-item ${styleClass}">${opt}</div>`;
            }).join('')}
          </div>
          <div class="status-tag">
            ${userSelection === null ? '<span style="color:#6c757d;">Status: Skipped</span>' :
              userSelection === item.ans ? '<span style="color:#28a745;">Status: Correct (+2)</span>' :
              '<span style="color:#dc3545;">Status: Incorrect (-0.5)</span>'}
          </div>
        </div>
      `;
    }).join('');
  }

  // Push Data via Fetch to Google Apps Script
  function syncResultsToGoogleSheet(payload) {
    if(!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL") return;

    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).catch(err => console.error("Sync Error:", err));
  }
</script>
